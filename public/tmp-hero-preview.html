<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        background: #111;
      }
      .hero {
        position: relative;
        width: 1400px;
        height: 700px;
        overflow: hidden;
        background: #111;
        margin: 0 auto;
      }
      .frame {
        position: absolute;
        left: auto;
        right: 0;
        top: 0;
        bottom: 0;
        height: 100%;
        width: auto;
        aspect-ratio: 3 / 4;
        min-width: 54%;
        max-width: 60%;
      }
      .frame img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 80% 52%;
      }
      .red {
        position: absolute;
        inset-y: 0;
        left: 0;
        width: 40%;
        background: #dc2626;
        clip-path: polygon(0 0, 100% 0, 70% 100%, 0 100%);
        z-index: 1;
      }
      .txt {
        position: relative;
        z-index: 2;
        color: #fff;
        padding: 4rem 2rem;
        max-width: 320px;
        font-family: system-ui, sans-serif;
      }
      .txt h1 {
        font-size: 2.5rem;
        line-height: 1.15;
      }
      .txt p {
        opacity: 0.95;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="hero">
      <div class="frame">
        <img src="/images/hero-canak-portrait.jpg" alt="" />
      </div>
      <div class="red"></div>
      <div class="txt">
        <p
          style="
            font-size: 12px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            font-weight: 700;
            margin-bottom: 1rem;
          "
        >
          Uydu · Çanak Anten
        </p>
        <h1>Net sinyal, doğru montaj.</h1>
        <p>Çanak kurulumu, yön ayarı ve sinyal ölçümü.</p>
      </div>
    </div>
  </body>
</html>
